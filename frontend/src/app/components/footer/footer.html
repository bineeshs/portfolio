<footer class="footer">
    <div class="container footer-content">
        <div class="footer-brand">
            <div class="logo font-heading gradient-text">BS.</div>
            <p class="tagline">Building scales and digital experiences.</p>
        </div>

        <div class="footer-contact">
            <h3 class="footer-title">Contact Details</h3>
            <p class="contact-item">
                <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                    fill="currentColor">
                    <path
                        d="M480-480q33 0 56.5-23.5T560-560q0-33-23.5-56.5T480-640q-33 0-56.5 23.5T400-560q0 33 23.5 56.5T480-480Zm0 294q122-112 181-203.5T720-552q0-109-69.5-178.5T480-800q-101 0-170.5 69.5T240-552q0 71 59 162.5T480-186Zm0 106Q319-217 239.5-334.5T160-552q0-150 96.5-249T480-900q184 0 280.5 99T800-552q0 119-79.5 236.5T480-80Zm0-472Z" />
                </svg>
                {{ data?.address }}
            </p>
            <div class="phone-group">
                <p class="contact-item" *ngFor="let phone of data?.phone">
                    <svg xmlns="http://www.w3.org/2000/svg" height="20" viewBox="0 -960 960 960" width="20"
                        fill="currentColor">
                        <path
                            d="M798-120q-125 0-247-54.5T329-329Q229-429 174.5-551T120-798q0-18 12-30t30-12h162q14 0 25 9.5t13.5 22.5l26 162q2 14-1.5 27T377-599L277-499q45 88 116.5 160T535-240l100-100q11-11 24-14.5t27 1.5l162 26q13 5 22.5 16t9.5 25v162q0 18-12 30t-30 12ZM241-601l76-76-22-143H181q6 72 26 141t34 78Zm360 360q71 20 142 26v-115l-143-22-76 76ZM241-601Zm360 360Z" />
                    </svg>
                    {{ phone }}
                </p>
            </div>
        </div>

        <div class="footer-links">
            <h3 class="footer-title">Connect</h3>
            <div class="social-icons">
                <a [href]="data?.linkedin" target="_blank" aria-label="LinkedIn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M19 0h-14c-2.761 0-5 2.239-5 5v14c0 2.761 2.239 5 5 5h14c2.762 0 5-2.239 5-5v-14c0-2.761-2.238-5-5-5zm-11 19h-3v-11h3v11zm-1.5-12.268c-.966 0-1.75-.79-1.75-1.764s.784-1.764 1.75-1.764 1.75.79 1.75 1.764-.783 1.764-1.75 1.764zm13.5 12.268h-3v-5.604c0-3.368-4-3.113-4 0v5.604h-3v-11h3v1.765c1.396-2.586 7-2.777 7 2.476v6.759z" />
                    </svg>
                </a>
                <a [href]="data?.github" target="_blank" aria-label="GitHub">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M12 0c-6.626 0-12 5.373-12 12 0 5.302 3.438 9.8 8.207 11.387.599.111.793-.261.793-.577v-2.234c-3.338.726-4.033-1.416-4.033-1.416-.546-1.387-1.333-1.756-1.333-1.756-1.089-.745.083-.729.083-.729 1.205.084 1.839 1.237 1.839 1.237 1.07 1.834 2.807 1.304 3.492.997.107-.775.418-1.305.762-1.604-2.665-.305-5.467-1.334-5.467-5.931 0-1.311.469-2.381 1.236-3.221-.124-.303-.535-1.524.117-3.176 0 0 1.008-.322 3.301 1.23.957-.266 1.983-.399 3.003-.404 1.02.005 2.047.138 3.006.404 2.291-1.552 3.297-1.23 3.297-1.23.653 1.653.242 2.874.118 3.176.77.84 1.235 1.911 1.235 3.221 0 4.609-2.807 5.624-5.479 5.921.43.372.823 1.102.823 2.222v3.293c0 .319.192.694.801.576 4.765-1.589 8.199-6.086 8.199-11.386 0-6.627-5.373-12-12-12z" />
                    </svg>
                </a>
                <a [href]="data?.gitlab" target="_blank" aria-label="GitLab">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="currentColor">
                        <path
                            d="M23.953 4.57a.106.106 0 0 0-.047-.048.105.105 0 0 0-.05-.015.111.111 0 0 0-.074.03l-2.071 2.012-4.102-12.63c-.015-.044-.047-.08-.09-.101a.111.111 0 0 0-.115 0c-.043.021-.075.057-.09.101L13.207 6.55H10.79L8.688.118a.11.11 0 0 0-.09-.1c-.046-.01-.093-.004-.136.019a.11.11 0 0 0-.057.081L4.305 6.55H2.072L.001 4.537A.11.11 0 0 0 0 4.533a.111.111 0 0 0 .111.11l2.002 1.947 3.515 10.829a.111.111 0 0 0 .041.059.111.111 0 0 0 .13.003h.001a.111.111 0 0 0 .04-.06l1.393-4.29h9.536l1.393 4.29a.111.111 0 0 0 .04.06.111.111 0 0 0 .13-.003.111.111 0 0 0 .041-.059l3.515-10.83 2.002-1.947a.11.11 0 0 0 .074-.103z" />
                    </svg>
                </a>
            </div>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; {{ currentYear }} {{ data?.name }}. All rights reserved.</p>
    </div>
</footer>
