<div class="modal-overlay" (click)="closeModal()">
    <div class="modal-container glass-card" (click)="$event.stopPropagation()">
        <button class="close-btn" (click)="closeModal()">
            <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">
                <path
                    d="m256-200-56-56 224-224-224-224 56-56 224 224 224-224 56 56-224 224 224 224-56 56-224-224-224 224Z" />
            </svg>
        </button>

        <div class="modal-content">
            <img [src]="currentImage" alt="Project Screenshot" class="preview-img">

            <div class="navigation-controls" *ngIf="images.length > 1">
                <button class="nav-btn prev" (click)="prev()">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"
                        fill="currentColor">
                        <path d="M560-240 320-480l240-240 56 56-184 184 184 184-56 56Z" />
                    </svg>
                </button>
                <button class="nav-btn next" (click)="next()">
                    <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24"
                        fill="currentColor">
                        <path d="M380-240 324-296l184-184-184-184 56-56 240 240-240 240Z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="modal-footer" *ngIf="images.length > 1">
            <span class="counter">{{ currentIndex + 1 }} / {{ images.length }}</span>
        </div>
    </div>
</div>
